{% extends "base.html" %}
{% block main_width %}max-w-5xl{% endblock %}
{% block nav_width %}max-w-5xl{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white p-6 rounded-md shadow-sm">
  <h1 class="text-xl font-semibold mb-4">登录</h1>
  <form method="post" action="/login" class="flex flex-col gap-3">
    <input type="password" name="password" placeholder="密码" required
           class="border rounded px-3 py-2" autofocus />
    <button class="bg-slate-900 text-white py-2 rounded">进入</button>
  </form>
</div>
{% endblock %}
