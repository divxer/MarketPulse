<article class="mt-3 p-4 bg-slate-50 rounded">
  <div class="text-slate-500 text-xs mb-3" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <span>{% if result.cached %}缓存结果{% else %}实时生成{% endif %}</span>
    {% if strategy_display %}
    <span class="mp-chip mp-chip--strategy" title="策略由 router 自动选择">{{ strategy_display }}</span>
    {% endif %}
    <span class="mono">{{ result.model }}</span>
    <span class="mono">{{ result.prompt_version }}</span>
  </div>
  <div class="ai-markdown text-slate-800 leading-relaxed">
    {{ result.response_markdown | markdown }}
  </div>
</article>
