<section class="mp-card"><div class="mp-card__body">
  <table class="mp-table">
    <tbody>
      <tr><td>Excess Return</td><td class="num">{{ view.hero_excess_return_label }}</td></tr>
      <tr><td>Portfolio Index</td><td class="num">{{ view.portfolio_index_label }}</td></tr>
      <tr><td>SPY Index</td><td class="num">{{ view.spy_index_label }}</td></tr>
      <tr><td>Coverage</td><td class="num">{{ view.coverage_label }}</td></tr>
      <tr><td>Sufficient</td>
          <td class="num">
            <span class="mp-chip {% if view.is_sufficient %}mp-chip--success{% else %}mp-chip--warn{% endif %}">
              {{ "Yes" if view.is_sufficient else "No" }}</span></td></tr>
    </tbody>
  </table>
</div></section>
