# Phase 5c-1: manual sector overrides for tickers where yfinance is wrong, missing,
# or where the natural GICS sector doesn't capture meaningful exposure correlation.
#
# Use cases:
# - Leveraged ETFs (3x bull / bear)
# - Thematic ETFs without natural GICS sector
# - Crypto / digital asset proxies
#
# Equity tickers (AAPL, GOOGL, AMSC, etc.) fall through to yfinance default.
overrides:
  TQQQ: leveraged_qqq
  TNA: leveraged_small_cap
  QBTS: quantum_compute
  QUBT: quantum_compute
  # Common equities held / traded — pinned here so the SectorExposureGate
  # in paper_trading_tick doesn't reject on first-call yfinance latency or
  # rate-limit failures. yfinance-backed fallback in
  # marketpulse/trading/risk_gates/_sector.py still works for everything
  # else; these are just the high-frequency offenders observed 2026-05-27.
  AAPL: Technology
  AMAT: Technology
  AMD: Technology
  AMSC: Industrials
  GOOG: Communication Services
  GOOGL: Communication Services
  LRCX: Technology
  META: Communication Services
  MSFT: Technology
  NVDA: Technology
