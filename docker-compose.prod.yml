# Production / NAS deployment compose — pulls pre-built image from GHCR.
#
# Use this in Portainer Stacks (Repository or Web editor mode). It does NOT
# build from source; the image is built by GitHub Actions on every push to
# main and tagged `:latest` (plus `:sha-<short>` and any `v*` tag).
#
# For local development / NAS-builds-from-source, use docker-compose.yml.
#
# Required environment variables (set in Portainer UI when creating the stack):
#   APP_PASSWORD_HASH      bcrypt hash for login (see DEPLOY.md)
#   SESSION_SECRET         32+ bytes of random hex
#   ANTHROPIC_API_KEY      Claude API key
# Optional (have sensible defaults):
#   WATCHLIST_RECAP_TIME, LOG_LEVEL, AI_MODEL, AI_CACHE_TTL_HOURS, NEWS_CACHE_TTL_DAYS

services:
  marketpulse:
    image: ghcr.io/divxer/marketpulse:latest
    pull_policy: always
    container_name: marketpulse
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - marketpulse_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: sqlite:////data/marketpulse.db
      # Persist the yfinance sector cache on the mounted volume so it survives
      # container recreation (otherwise /watchlist sectors reset to Uncategorized).
      SECTOR_CACHE_PATH: ${SECTOR_CACHE_PATH:-/data/sector_cache.json}
      WATCHLIST_RECAP_TIME: ${WATCHLIST_RECAP_TIME:-16:30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-}
      # Phase 3: cheap router model. Default Haiku — DO NOT leave empty in
      # production (fallback is AI_MODEL ~100x more expensive per router call).
      AI_MODEL_ROUTER: ${AI_MODEL_ROUTER:-claude-haiku-4-5}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-24}
      # Task #57 — nightly eval-analysis job (Watchlist ∪ open holdings, 21:00
      # UTC Mon-Fri, eval-only). Enabled here by deliberate choice; the cap
      # counts FRESH sonnet analyses/day (cache hits & errors don't consume it).
      # Set AI_EVAL_ENABLED=false in host env to pause without editing this file.
      AI_EVAL_ENABLED: ${AI_EVAL_ENABLED:-true}
      AI_EVAL_MAX_CALLS_PER_DAY: ${AI_EVAL_MAX_CALLS_PER_DAY:-40}
      AI_EVAL_HOUR: ${AI_EVAL_HOUR:-21}          # UTC (post-close ~17:00 ET EDT)
      AI_EVAL_MINUTE: ${AI_EVAL_MINUTE:-0}
      NEWS_CACHE_TTL_DAYS: ${NEWS_CACHE_TTL_DAYS:-7}
      QUOTE_CACHE_TTL_SECONDS: ${QUOTE_CACHE_TTL_SECONDS:-300}
      QUOTE_SOURCE: ${QUOTE_SOURCE:-auto}
      NOTIFIER_KIND: ${NOTIFIER_KIND:-none}
      NOTIFIER_BARK_URL: ${NOTIFIER_BARK_URL:-}
      NOTIFIER_SERVERCHAN_KEY: ${NOTIFIER_SERVERCHAN_KEY:-}
      NOTIFIER_SMTP_HOST: ${NOTIFIER_SMTP_HOST:-}
      NOTIFIER_SMTP_PORT: ${NOTIFIER_SMTP_PORT:-587}
      NOTIFIER_SMTP_USER: ${NOTIFIER_SMTP_USER:-}
      NOTIFIER_SMTP_PASSWORD: ${NOTIFIER_SMTP_PASSWORD:-}
      NOTIFIER_EMAIL_FROM: ${NOTIFIER_EMAIL_FROM:-}
      NOTIFIER_EMAIL_TO: ${NOTIFIER_EMAIL_TO:-}
      NOTIFIER_RECAP_ENABLED: ${NOTIFIER_RECAP_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALERT_DEBOUNCE_MINUTES: ${ALERT_DEBOUNCE_MINUTES:-60}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # httpx (used by TencentClient and the IBKR Flex client) does NOT
      # recognize the `*.domain.com` wildcard. Use leading-dot suffix +
      # explicit hostnames so Tencent gtimg.cn requests bypass any
      # HTTP_PROXY/Clash route and go direct. Without this, Tencent calls
      # get sent through overseas exit nodes and Tencent's CDN closes the
      # TLS connection mid-handshake.
      #
      # IBKR Flex endpoints (.interactivebrokers.com, gdcdyn/ndcdyn) are
      # listed for the same reason: when deployed behind Clash/Mihomo on a
      # NAS, Flex requests routed through overseas exit nodes exceed httpx's
      # 5s connect+TLS timeout and the Phase 7a-Flex readonly sync fails.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.gtimg.cn,qt.gtimg.cn,web.ifzq.gtimg.cn,.interactivebrokers.com,gdcdyn.interactivebrokers.com,ndcdyn.interactivebrokers.com}
      # Phase 7a-Flex IBKR read-only sync via Flex Web Service (HTTPS+XML).
      # No Gateway sidecar — snapshots are pulled directly from IBKR's
      # Flex endpoint. See docs/operations/ibkr-readonly-sync-runbook.md
      # for the one-time IBKR Portal setup.
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN:-}
      IBKR_FLEX_QUERY_ID: ${IBKR_FLEX_QUERY_ID:-}
      IBKR_FLEX_BASE_URL: ${IBKR_FLEX_BASE_URL:-https://gdcdyn.interactivebrokers.com/Universal/servlet}
      IBKR_FLEX_POLL_INTERVAL_SECONDS: ${IBKR_FLEX_POLL_INTERVAL_SECONDS:-5}
      IBKR_FLEX_MAX_WAIT_SECONDS: ${IBKR_FLEX_MAX_WAIT_SECONDS:-60}
      FLEX_SYNC_HOUR: ${FLEX_SYNC_HOUR:-23}
      FLEX_SYNC_MINUTE: ${FLEX_SYNC_MINUTE:-30}
      IBKR_ACCOUNT_ID: ${IBKR_ACCOUNT_ID:-}
      MP_IBKR_ALLOW_LIVE: ${MP_IBKR_ALLOW_LIVE:-false}
      # Paper-trading engine (Phase 6). Surfaced for ops visibility — defaults
      # match code. Flip MP_PAPER_KILL_SWITCH=true in host env to halt paper
      # trading immediately (env change + restart, no code edit). Tick runs at
      # 17:30 in the scheduler's base tz (America/New_York) = post US close.
      MP_PAPER_KILL_SWITCH: ${MP_PAPER_KILL_SWITCH:-false}
      MP_PAPER_TICK_HOUR: ${MP_PAPER_TICK_HOUR:-17}
      MP_PAPER_TICK_MINUTE: ${MP_PAPER_TICK_MINUTE:-30}
      MP_PAPER_NOTIFICATIONS_ENABLED: ${MP_PAPER_NOTIFICATIONS_ENABLED:-true}
      MP_PAPER_INITIAL_DEPOSIT: ${MP_PAPER_INITIAL_DEPOSIT:-10000}
      # Phase 7b — IBKR Gateway sidecar order execution
      IBKR_ORDER_HOST: ${IBKR_ORDER_HOST:-ib-gateway}
      IBKR_ORDER_PORT: ${IBKR_ORDER_PORT:-4002}
      IBKR_ORDER_CLIENT_ID: ${IBKR_ORDER_CLIENT_ID:-72}
      IBKR_ORDER_CONNECT_TIMEOUT_SECONDS: ${IBKR_ORDER_CONNECT_TIMEOUT_SECONDS:-10}
      IBKR_ORDER_NEXT_VALID_ID_TIMEOUT_SECONDS: ${IBKR_ORDER_NEXT_VALID_ID_TIMEOUT_SECONDS:-10}
      IBKR_ORDER_OBSERVATION_TIMEOUT_SECONDS: ${IBKR_ORDER_OBSERVATION_TIMEOUT_SECONDS:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Phase 7b IBKR paper order execution — TWS Gateway sidecar.
  # Headless IB Gateway with IBC auto-login. paper mode only; 4002 is the
  # Gateway paper API socket. marketpulse talks to ib-gateway:4002 via the
  # compose docker network — no host port bind for the API socket itself.
  #
  # CRITICAL ACCOUNT PREREQUISITE:
  #   IBKR account tier MUST be Pro, not Lite. Lite accounts have no API
  #   entitlement; the Gateway will display "API support is not available
  #   for accounts that support free trading" on every login and the API
  #   socket will never open. Switch via IBKR Portal → Settings →
  #   IBKR Pricing Plan.
  #
  # CRITICAL ONE-TIME SETUP after first boot (VNC into <host>:5900):
  #   1. Configure → Settings → API → Settings
  #      - ✅ Enable ActiveX and Socket Clients
  #      - Socket port = 4002 (paper)
  #      - Trusted IPs → Add the marketpulse container's docker subnet
  #        (typically 192.168.80.0/24) or the explicit container IP.
  #        IBC does NOT propagate this setting from its config in this
  #        gnzsnz image version — the operator MUST set it via the GUI.
  #   2. The setting persists in the TWS_SETTINGS_PATH volume across
  #      container restarts / recreations.
  ib-gateway:
    image: ${IB_GATEWAY_IMAGE:-ghcr.io/gnzsnz/ib-gateway:stable}
    pull_policy: always
    container_name: ib-gateway
    restart: unless-stopped
    ports:
      # VNC for one-time GUI configuration. Bind to LAN IP only — VNC is
      # NOT encrypted; do NOT expose to public internet.
      - "${IB_GATEWAY_VNC_BIND:-0.0.0.0:5900}:5900"
    environment:
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}  # In Portainer: escape every `$` as `$$`
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: "no"  # Phase 7b needs write capability
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD}
      TZ: America/New_York
      # IBC auto-handles the "Existing session detected" dialog by clicking
      # "Continue Login" (takes over the stale server-side session).
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      # IBC auto-clicks runtime "Accept incoming connection?" dialogs.
      BYPASS_WARNING: "yes"
      # Daily IBKR forced-logout recovery (IBKR resets paper sessions ~23:55 NY).
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "23:00"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # Persist settings (TrustedIPs cache, jts.ini etc.) so the one-time
      # VNC config survives container restarts. gnzsnz official guidance:
      # set TWS_SETTINGS_PATH then bind/volume-mount that path.
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
    volumes:
      - /volume1/docker/ib-gateway/tws_settings:/home/ibgateway/tws_settings
    # Mount /tmp as tmpfs (RAM-backed, 512MB cap) — gnzsnz README recommends.
    # Gateway writes hundreds of MB of cache/session data to /tmp daily;
    # without this it accumulates in the container's writable layer and
    # eventually requires a container recreate to reclaim space.
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      # /proc/net/tcp shows local listening sockets. 0FA2 = 4002 in hex.
      # Image does not ship `nc` so we read /proc directly.
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q ':0FA2' || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  marketpulse_data:

# Pin the compose network to 192.168.80.0/24 so the marketpulse container
# IP stays stable across `docker compose down/up`. The Phase 7b sidecar's
# Gateway-side Trusted IPs (set via VNC) reference this subnet; if docker
# reassigns the subnet on recreate, Phase 7b orders silently fail at the
# TrustedIPs handshake. Do NOT change this subnet without re-doing the
# VNC Trusted IPs config.
networks:
  default:
    name: marketpulse_default
    ipam:
      config:
        - subnet: 192.168.80.0/24
