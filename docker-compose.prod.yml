# Production / NAS deployment compose — pulls pre-built image from GHCR.
#
# Use this in Portainer Stacks (Repository or Web editor mode). It does NOT
# build from source; the image is built by GitHub Actions on every push to
# main and tagged `:latest` (plus `:sha-<short>` and any `v*` tag).
#
# For local development / NAS-builds-from-source, use docker-compose.yml.
#
# Required environment variables (set in Portainer UI when creating the stack):
#   APP_PASSWORD_HASH      bcrypt hash for login (see DEPLOY.md)
#   SESSION_SECRET         32+ bytes of random hex
#   ANTHROPIC_API_KEY      Claude API key
# Optional (have sensible defaults):
#   WATCHLIST_RECAP_TIME, LOG_LEVEL, AI_MODEL, AI_CACHE_TTL_HOURS, NEWS_CACHE_TTL_DAYS

services:
  marketpulse:
    image: ghcr.io/divxer/marketpulse:latest
    pull_policy: always
    container_name: marketpulse
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - marketpulse_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: sqlite:////data/marketpulse.db
      WATCHLIST_RECAP_TIME: ${WATCHLIST_RECAP_TIME:-16:30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-}
      # Phase 3: cheap router model. Default Haiku — DO NOT leave empty in
      # production (fallback is AI_MODEL ~100x more expensive per router call).
      AI_MODEL_ROUTER: ${AI_MODEL_ROUTER:-claude-haiku-4-5}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-24}
      NEWS_CACHE_TTL_DAYS: ${NEWS_CACHE_TTL_DAYS:-7}
      QUOTE_CACHE_TTL_SECONDS: ${QUOTE_CACHE_TTL_SECONDS:-300}
      QUOTE_SOURCE: ${QUOTE_SOURCE:-auto}
      NOTIFIER_KIND: ${NOTIFIER_KIND:-none}
      NOTIFIER_BARK_URL: ${NOTIFIER_BARK_URL:-}
      NOTIFIER_SERVERCHAN_KEY: ${NOTIFIER_SERVERCHAN_KEY:-}
      NOTIFIER_SMTP_HOST: ${NOTIFIER_SMTP_HOST:-}
      NOTIFIER_SMTP_PORT: ${NOTIFIER_SMTP_PORT:-587}
      NOTIFIER_SMTP_USER: ${NOTIFIER_SMTP_USER:-}
      NOTIFIER_SMTP_PASSWORD: ${NOTIFIER_SMTP_PASSWORD:-}
      NOTIFIER_EMAIL_FROM: ${NOTIFIER_EMAIL_FROM:-}
      NOTIFIER_EMAIL_TO: ${NOTIFIER_EMAIL_TO:-}
      NOTIFIER_RECAP_ENABLED: ${NOTIFIER_RECAP_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALERT_DEBOUNCE_MINUTES: ${ALERT_DEBOUNCE_MINUTES:-60}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # httpx (used by TencentClient and the IBKR Flex client) does NOT
      # recognize the `*.domain.com` wildcard. Use leading-dot suffix +
      # explicit hostnames so Tencent gtimg.cn requests bypass any
      # HTTP_PROXY/Clash route and go direct. Without this, Tencent calls
      # get sent through overseas exit nodes and Tencent's CDN closes the
      # TLS connection mid-handshake.
      #
      # IBKR Flex endpoints (.interactivebrokers.com, gdcdyn/ndcdyn) are
      # listed for the same reason: when deployed behind Clash/Mihomo on a
      # NAS, Flex requests routed through overseas exit nodes exceed httpx's
      # 5s connect+TLS timeout and the Phase 7a-Flex readonly sync fails.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.gtimg.cn,qt.gtimg.cn,web.ifzq.gtimg.cn,.interactivebrokers.com,gdcdyn.interactivebrokers.com,ndcdyn.interactivebrokers.com}
      # Phase 7a-Flex IBKR read-only sync via Flex Web Service (HTTPS+XML).
      # No Gateway sidecar — snapshots are pulled directly from IBKR's
      # Flex endpoint. See docs/operations/ibkr-readonly-sync-runbook.md
      # for the one-time IBKR Portal setup.
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN:-}
      IBKR_FLEX_QUERY_ID: ${IBKR_FLEX_QUERY_ID:-}
      IBKR_FLEX_BASE_URL: ${IBKR_FLEX_BASE_URL:-https://gdcdyn.interactivebrokers.com/Universal/servlet}
      IBKR_FLEX_POLL_INTERVAL_SECONDS: ${IBKR_FLEX_POLL_INTERVAL_SECONDS:-5}
      IBKR_FLEX_MAX_WAIT_SECONDS: ${IBKR_FLEX_MAX_WAIT_SECONDS:-60}
      IBKR_ACCOUNT_ID: ${IBKR_ACCOUNT_ID:-}
      MP_IBKR_ALLOW_LIVE: ${MP_IBKR_ALLOW_LIVE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  marketpulse_data:
