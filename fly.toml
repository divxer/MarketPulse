app = "marketpulse"
primary_region = "iad"

[build]

[env]
  DATABASE_URL = "sqlite:////data/marketpulse.db"
  LOG_LEVEL = "INFO"
  WATCHLIST_RECAP_TIME = "16:30"

[[mounts]]
  source = "marketpulse_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
