# China-friendly variant of docker-compose.prod.yml.
#
# Same as the prod compose but pulls the image from Aliyun ACR (Beijing region),
# which is fast and stable from mainland China. The image is built and pushed
# to BOTH ghcr.io (canonical) and Aliyun ACR by GitHub Actions on every push.
#
# Use with Portainer Stacks (Web editor mode):
#   - Paste this file's contents
#   - Set APP_PASSWORD_HASH, SESSION_SECRET, ANTHROPIC_API_KEY in env vars
#
# Required environment variables:
#   APP_PASSWORD_HASH      bcrypt hash for login (see DEPLOY.md)
#   SESSION_SECRET         32+ bytes of random hex
#   ANTHROPIC_API_KEY      Claude API key
# Optional (have sensible defaults):
#   WATCHLIST_RECAP_TIME, LOG_LEVEL, AI_MODEL, AI_CACHE_TTL_HOURS, NEWS_CACHE_TTL_DAYS

services:
  marketpulse:
    image: crpi-wo56gda7tim6c1ik.cn-beijing.personal.cr.aliyuncs.com/divxer/marketpulse:latest
    pull_policy: always
    container_name: marketpulse
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - /volume1/docker/marketpulse/data:/data
    extra_hosts:
      # Maps host.docker.internal to the bridge gateway so the container can
      # reach services running on the NAS host (e.g. a local Mihomo/Clash proxy
      # at the host's :7892). Required for HTTP_PROXY/HTTPS_PROXY below.
      - "host.docker.internal:host-gateway"
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: sqlite:////data/marketpulse.db
      WATCHLIST_RECAP_TIME: ${WATCHLIST_RECAP_TIME:-16:30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      # Optional premium model for /stock AI deep analysis only. Leave empty
      # to use AI_MODEL for everything. Daily recap + portfolio risk always
      # use the cheap AI_MODEL.
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-24}
      NEWS_CACHE_TTL_DAYS: ${NEWS_CACHE_TTL_DAYS:-7}
      QUOTE_CACHE_TTL_SECONDS: ${QUOTE_CACHE_TTL_SECONDS:-300}
      QUOTE_SOURCE: ${QUOTE_SOURCE:-auto}
      NOTIFIER_KIND: ${NOTIFIER_KIND:-none}
      NOTIFIER_BARK_URL: ${NOTIFIER_BARK_URL:-}
      NOTIFIER_SERVERCHAN_KEY: ${NOTIFIER_SERVERCHAN_KEY:-}
      NOTIFIER_SMTP_HOST: ${NOTIFIER_SMTP_HOST:-}
      NOTIFIER_SMTP_PORT: ${NOTIFIER_SMTP_PORT:-587}
      NOTIFIER_SMTP_USER: ${NOTIFIER_SMTP_USER:-}
      NOTIFIER_SMTP_PASSWORD: ${NOTIFIER_SMTP_PASSWORD:-}
      NOTIFIER_EMAIL_FROM: ${NOTIFIER_EMAIL_FROM:-}
      NOTIFIER_EMAIL_TO: ${NOTIFIER_EMAIL_TO:-}
      NOTIFIER_RECAP_ENABLED: ${NOTIFIER_RECAP_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALERT_DEBOUNCE_MINUTES: ${ALERT_DEBOUNCE_MINUTES:-60}
      # Outbound HTTP proxy (e.g. for reaching Anthropic API from regions where
      # it's blocked). Leave empty to disable. NO_PROXY bypasses for hosts that
      # are already China-friendly (Tencent quote/kline) or local.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,*.gtimg.cn}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
