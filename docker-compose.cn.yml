# China-friendly variant of docker-compose.prod.yml.
#
# Same as the prod compose but pulls the image from Aliyun ACR (Beijing region),
# which is fast and stable from mainland China. The image is built and pushed
# to BOTH ghcr.io (canonical) and Aliyun ACR by GitHub Actions on every push.
#
# Use with Portainer Stacks (Web editor mode):
#   - Paste this file's contents
#   - Set APP_PASSWORD_HASH, SESSION_SECRET, ANTHROPIC_API_KEY in env vars
#
# Required environment variables:
#   APP_PASSWORD_HASH      bcrypt hash for login (see DEPLOY.md)
#   SESSION_SECRET         32+ bytes of random hex
#   ANTHROPIC_API_KEY      Claude API key
# Optional (have sensible defaults):
#   WATCHLIST_RECAP_TIME, LOG_LEVEL, AI_MODEL, AI_CACHE_TTL_HOURS, NEWS_CACHE_TTL_DAYS

services:
  marketpulse:
    image: crpi-wo56gda7tim6c1ik.cn-beijing.personal.cr.aliyuncs.com/divxer/marketpulse:latest
    pull_policy: always
    container_name: marketpulse
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - /volume1/docker/marketpulse/data:/data
    extra_hosts:
      # Maps host.docker.internal to the bridge gateway so the container can
      # reach services running on the NAS host (e.g. a local Mihomo/Clash proxy
      # at the host's :7892). Required for HTTP_PROXY/HTTPS_PROXY below.
      - "host.docker.internal:host-gateway"
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: sqlite:////data/marketpulse.db
      WATCHLIST_RECAP_TIME: ${WATCHLIST_RECAP_TIME:-16:30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      # Optional premium model for /stock AI deep analysis only. Leave empty
      # to use AI_MODEL for everything. Daily recap + portfolio risk always
      # use the cheap AI_MODEL.
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-}
      # Phase 3: cheap router model. Default Haiku — DO NOT leave empty in
      # production (fallback is AI_MODEL ~100x more expensive per router call).
      AI_MODEL_ROUTER: ${AI_MODEL_ROUTER:-claude-haiku-4-5}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-24}
      NEWS_CACHE_TTL_DAYS: ${NEWS_CACHE_TTL_DAYS:-7}
      QUOTE_CACHE_TTL_SECONDS: ${QUOTE_CACHE_TTL_SECONDS:-300}
      QUOTE_SOURCE: ${QUOTE_SOURCE:-auto}
      NOTIFIER_KIND: ${NOTIFIER_KIND:-none}
      NOTIFIER_BARK_URL: ${NOTIFIER_BARK_URL:-}
      NOTIFIER_SERVERCHAN_KEY: ${NOTIFIER_SERVERCHAN_KEY:-}
      NOTIFIER_SMTP_HOST: ${NOTIFIER_SMTP_HOST:-}
      NOTIFIER_SMTP_PORT: ${NOTIFIER_SMTP_PORT:-587}
      NOTIFIER_SMTP_USER: ${NOTIFIER_SMTP_USER:-}
      NOTIFIER_SMTP_PASSWORD: ${NOTIFIER_SMTP_PASSWORD:-}
      NOTIFIER_EMAIL_FROM: ${NOTIFIER_EMAIL_FROM:-}
      NOTIFIER_EMAIL_TO: ${NOTIFIER_EMAIL_TO:-}
      NOTIFIER_RECAP_ENABLED: ${NOTIFIER_RECAP_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALERT_DEBOUNCE_MINUTES: ${ALERT_DEBOUNCE_MINUTES:-60}
      # Outbound HTTP proxy (e.g. for reaching Anthropic API from regions where
      # it's blocked). Leave empty to disable. NO_PROXY bypasses for hosts that
      # are already China-friendly (Tencent quote/kline) or local.
      #
      # httpx (used by TencentClient) does NOT recognize the `*.domain.com`
      # wildcard — its httpcore proxy resolver only matches leading-dot suffix
      # or explicit hostnames. With the wildcard, Tencent calls get routed
      # through Clash/Mihomo to overseas exit nodes and Tencent's CDN
      # terminates the TLS handshake (SSL UNEXPECTED_EOF_WHILE_READING).
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.gtimg.cn,qt.gtimg.cn,web.ifzq.gtimg.cn,ib-gateway}
      # Phase 7a IBKR read-only sync. ib-gateway service below provides the
      # paper-account socket on port 4002. With these defaults the CLI
      # `uv run python scripts/sync_ibkr_readonly.py` works without args.
      IBKR_HOST: ${IBKR_HOST:-ib-gateway}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-71}
      IBKR_ACCOUNT_ID: ${IBKR_ACCOUNT_ID:-}
      IBKR_CONNECT_TIMEOUT_SECONDS: ${IBKR_CONNECT_TIMEOUT_SECONDS:-10}
      MP_IBKR_ALLOW_LIVE: ${MP_IBKR_ALLOW_LIVE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Phase 7a IBKR read-only broker truth capture. Headless IB Gateway with
  # IBC auto-login. paper mode by default — 4002 is the IB Gateway paper
  # port (TWS paper is 7497; we use Gateway, not TWS, because Gateway is
  # designed for 7x24 server-side automation).
  #
  # CRITICAL one-time setup after first boot (VNC into 192.168.50.29:5900):
  #   1. TWS API → Settings → ✅ Enable ActiveX and Socket Clients
  #   2. TWS API → Settings → Socket Port = 4002
  #   3. TWS API → Precautions → ✅ Read-Only API (defense-in-depth)
  #   4. TWS API → Settings → Trusted IPs → add the marketpulse container's
  #      docker IP (or leave empty if same network)
  #
  # The image accepts a SettingsUpdateMode env var that auto-applies these
  # via Jts.ini — most settings are picked up on first boot, but
  # Read-Only API must be verified by hand.
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    pull_policy: always
    container_name: ib-gateway
    restart: unless-stopped
    ports:
      # VNC for first-boot GUI configuration. Bind to LAN IP (NAS local
      # network only); do NOT expose to the public internet. Connect from
      # your Mac with: open vnc://192.168.50.29:5900
      - "192.168.50.29:5900:5900"
      # API socket: only exposed within the compose network. marketpulse
      # talks to ib-gateway:4002 via docker DNS — no host port bind needed.
    environment:
      TWS_USERID: ${IBKR_USERNAME}            # IBKR paper account username
      TWS_PASSWORD: ${IBKR_PASSWORD}          # IBKR paper account password
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: ${IBKR_READ_ONLY_API:-yes}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD}
      TZ: America/New_York
      # IBC auto-restart at 23:00 NY to recover before the daily 23:55
      # IBKR-side forced logout. Avoids the "Gateway was disconnected
      # overnight" failure mode.
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "23:00"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
    volumes:
      - /volume1/docker/ib-gateway:/home/ibgateway
    healthcheck:
      # Check if the TWS API socket is listening. Gateway takes ~30s to
      # fully start (login + cold cache). 60s start_period.
      test: ["CMD-SHELL", "nc -z localhost 4002 || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
