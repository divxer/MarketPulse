[project]
name = "marketpulse"
version = "0.1.0"
description = "Self-hosted US stock watchlist + daily recap + AI analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    "empyrical-reloaded>=0.5",
    "apscheduler>=3.10",
    "yfinance>=0.2.50",
    "anthropic>=0.40",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "tenacity>=9.0",
    "markdown>=3.7",
    "exchange_calendars>=4.5,<5.0",
    "ibapi>=9.81.1.post1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008 (function call in default arg) is FastAPI's idiomatic Depends() pattern.
ignore = ["B008"]
